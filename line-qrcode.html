<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LINE QR Code | Shawn Huang</title>
  <meta name="description" content="Scan to add Shawn Huang on LINE" />

  <!-- Font Awesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- 引入全域 CSS（若路徑不同請自行調整，例如 ./css/style.css） -->
  <link rel="stylesheet" href="style.css" />

  <style>
    /* 此頁面專屬的佈局輔助樣式（其餘全部吃全域變數與樣式） */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: 40px auto;
    }
    .qr-card {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }
    .qr-image {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .note {
      color: var(--muted);
      margin-top: 16px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="index.html">Shawn Huang<span class="dot">.</span> Portfolio</a>
    </nav>
  </header>

  <main>
    <h1>Scan to Add Me on LINE</h1>
    <p class="subtitle">歡迎透過 LINE 與我聯繫交流</p>

    <!-- 套用全域的 .card 與懸浮動效 -->
    <div class="card qr-card">
      <img src="./assets/images/line-qrcode.png" alt="Shawn Huang's LINE QR Code" class="qr-image" width="220" height="220">
      <span class="note">Open LINE &gt; Add Friends &gt; QR Code</span>
    </div>

    <!-- 套用全域按鈕元件 .btn .btn-outline -->
    <div>
      <a href="index.html" class="btn btn-outline">
        <i class="fas fa-arrow-left"></i> Back to Contact
      </a>
    </div>
  </main>

  <footer>
    <p class="footer-text">© <span id="year"></span> Shawn Huang</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>

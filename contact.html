<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | Shawn Huang</title>
  <meta name="description" content="Contact page for Shawn Huang" />
  <meta name="color-scheme" content="light dark" />
  <style>
    /* ===== Design Tokens (黑金主題，與 index / projects 一致) ===== */
    :root {
      --bg: #0d0d0d;
      --fg: #f5f5f5;
      --muted: #d4d4d8;
      --card: #1a1a1a;
      --border: #333;
      --shadow: 0 10px 30px rgba(0, 0, 0, .6);
      --primary: #facc15;      /* 金黃 */
      --primary-2: #eab308;
      --ring: 0 0 0 3px rgba(250, 204, 21, .25);
      --radius: 14px;
      --grad-1: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%);
    }

    /* ===== Base ===== */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.7 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--fg);
      background: var(--grad-1) fixed;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: none; box-shadow: var(--ring); border-radius: 8px; }

    /* ===== Header / Nav (含 hover 動畫) ===== */
    header {
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: saturate(120%) blur(10px);
      background: color-mix(in srgb, var(--card) 80%, transparent);
      border-bottom: 1px solid var(--border);
    }
    nav {
      max-width: 1040px; margin: 0 auto; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { font-weight: 800; letter-spacing: .3px; }
    .brand .dot { color: var(--primary); }
    .nav-links { display: flex; gap: 18px; }
    .nav-links a {
      padding: 8px 12px; border-radius: 10px;
      color: var(--muted); font-weight: 600;
      transition: color .25s ease, background .25s ease, transform .25s ease;
    }
    .nav-links a:hover {
      color: var(--primary);
      background: rgba(250, 204, 21, 0.08); /* 金色淡光 */
      transform: translateY(-2px);
    }

    /* ===== Layout ===== */
    main { max-width: 720px; margin: 42px auto; padding: 0 20px 60px; }
    h1 { font-size: clamp(26px, 4vw, 38px); margin: 0 0 20px; }

    /* ===== Card (含 hover 動畫) ===== */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      display: flex; flex-direction: column; gap: 14px;
      transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,.75);
      border-color: var(--primary);
    }

    /* 內容連結的互動感 */
    .card a {
      font-weight: 600;
      position: relative;
      transition: color .25s ease, text-underline-offset .25s ease;
      text-underline-offset: 2px;
    }
    .card a:hover {
      color: var(--primary);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* ===== Footer ===== */
    footer { text-align: center; padding: 24px; border-top: 1px solid var(--border); color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="index.html">Shawn Huang<span class="dot">.</span> Portfolio</a>
      <div class="nav-links">
        <a href="projects.html">Projects</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    <h1>Contact Me</h1>
    <div class="card">
      <p>📧 Email: <a href="mailto:s0909799081@gmail.com">s0909799081@gmail.com</a></p>
      <p>🐙 GitHub: <a href="https://github.com/shawnhuang125" target="_blank" rel="noreferrer">github.com/shawnhuang125</a></p>
      <p>💼 LinkedIn: <a href="https://linkedin.com/in/your-id" target="_blank" rel="noreferrer">linkedin.com/in/your-id</a></p>
    </div>
  </main>

  <footer>
    <small>© <span id="year"></span> Shawn Huang — Built with ❤️ using GitHub Pages</small>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | Shawn Huang</title>
  <meta name="description" content="Contact page for Shawn Huang" />
  <meta name="color-scheme" content="light dark" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* ===== Design Tokens (黑金主題) ===== */
    :root {
      --bg: #0d0d0d;
      --fg: #f5f5f5;
      --muted: #d4d4d8;
      --card: #1a1a1a;
      --border: #333;
      --shadow: 0 10px 30px rgba(0, 0, 0, .6);
      --primary: #facc15;      /* 金黃 */
      --primary-2: #eab308;
      --ring: 0 0 0 3px rgba(250, 204, 21, .25);
      --radius: 14px;
      --grad-1: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%);
    }

    /* ===== Base（與 index 相同）===== */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 16px/1.7 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--fg);
      background: var(--grad-1) fixed;
      background-attachment: fixed;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: none; box-shadow: var(--ring); border-radius: 10px; }

    /* ===== Header / Nav（與 index 一模一樣）===== */
    header {
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: saturate(120%) blur(10px);
      background: color-mix(in srgb, var(--card) 80%, transparent);
      border-bottom: 1px solid var(--border);
    }
    nav {
      max-width: 1040px; margin: 0 auto; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }

    /* Brand 樣式修復 + 動畫（與 index 相同） */
    .brand {
      display: inline-block;
      font-weight: 800;
      letter-spacing: .3px;
      color: var(--fg);
      white-space: nowrap;
      line-height: 1;
      transition: transform .25s ease, text-shadow .25s ease, color .25s ease;
    }
    .brand .dot { color: var(--primary); }
    .brand:hover { transform: translateY(-1px); text-shadow: 0 0 10px rgba(250, 204, 21, .35); }

    .nav-links { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
    .nav-links a {
      padding: 8px 12px;
      border-radius: 10px;
      transition: color .25s ease, background .25s ease, transform .25s ease;
      color: var(--muted);
      font-weight: 600;
    }
    .nav-links a:hover {
      color: var(--primary);
      background: rgba(250, 204, 21, 0.08);
      transform: translateY(-2px);
    }

    /* ===== Layout ===== */
    main { max-width: 720px; margin: 42px auto; padding: 0 20px 60px; }
    h1 { font-size: clamp(26px, 4vw, 38px); margin: 0 0 20px; }

    /* ===== Card（與其他頁一致的 hover）===== */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      display: flex; justify-content: center; gap: 28px;
      transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,.75);
      border-color: var(--primary);
    }

    /* ===== Icon Links ===== */
    .social a {
      font-size: 30px;
      color: var(--muted);
      transition: color .25s ease, transform .25s ease;
    }
    .social a:hover {
      color: var(--primary);
      transform: scale(1.2);
    }

    /* ===== Footer ===== */
    footer { text-align: center; padding: 24px; border-top: 1px solid var(--border); color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="index.html" aria-label="Go to home">
        Shawn Huang<span class="dot">.</span> Portfolio
      </a>
      <div class="nav-links">
        <a href="projects.html">Projects</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    <h1>Contact Me</h1>
    <div class="card social">
      <a href="mailto:s0909799081@gmail.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
      <a href="https://github.com/shawnhuang125" target="_blank" rel="noreferrer" aria-label="GitHub"><i class="fab fa-github"></i></a>
      <a href="https://linkedin.com/in/your-id" target="_blank" rel="noreferrer" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
    </div>
  </main>

  <footer>
    <small>© <span id="year"></span> Shawn Huang — Built with ❤️ using GitHub Pages</small>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
